[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-cleaner"
version = "0.1.0"
description = "Audit and cleaning tool for Zotero libraries via the local HTTP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
zotero-cleaner = "zotero_cleaner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
